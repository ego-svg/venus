<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planet Jumping</title>
  <meta name="description" content="An immersive space portal experience with canvas-driven 3D portal and video preloader." />
  <meta property="og:title" content="Planet Jumping" />
  <meta property="og:description" content="An immersive space portal experience with canvas-driven 3D portal and video preloader." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    @font-face {
      font-family: 'SF Pro';
      font-weight: 400;
      src: local('SF Pro Text Regular'), local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular');
    }
    @font-face {
      font-family: 'SF Pro';
      font-weight: 700;
      src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold');
    }
    @font-face {
      font-family: 'SF Pro Thin';
      font-weight: 100;
      src: local('SF Pro Text Thin'), local('SF Pro Thin'), local('SFProText-Thin');
    }
    @font-face {
      font-family: 'Aalto';
      font-weight: 400;
      src: local('Aalto'), local('Aalto Regular');
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090807;
    }
    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
    }

    *, html, body, button, a, .portal {
      cursor: none !important;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #0a0908;
    }
    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .background.is-visible {
      opacity: 1;
    }
    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
      pointer-events: none;
    }
    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity .45s ease, filter .45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    /* HEADER */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 19px;
      border-radius: 999px;
      line-height: 1;
      font-size: 14px;
    }
    .nav a.active {
      background: #fff;
      color: #000;
    }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
    }

    /* SIDEBAR */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: rgba(255, 255, 255, 0.7);
    }
    .planet-item.active {
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
      color: #fff;
    }
    .planet-item.active:before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      display: inline-block;
      flex-shrink: 0;
    }

    /* PORTAL */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
    }
    .portal-heading strong {
      font-size: 18px;
      margin-left: 8px;
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320/350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* CONTENT */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .planet-content h1 {
      font-family: Aalto, 'Arial Narrow', sans-serif;
      font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400;
      line-height: .72;
      margin: 0 0 -.04em;
      letter-spacing: 0;
      transform: translateX(-32px);
      opacity: 0;
    }
    .planet-content dl {
      width: min(447px, 34vw);
      margin: 0;
      font-size: 16px;
    }
    .fact {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .48);
      opacity: 0;
    }
    .fact:last-child {
      border-bottom: 0;
    }
    .fact dt {
      font-weight: 700;
    }
    .fact dd {
      margin: 0;
    }

    /* MISC */
    .transition-layer {
      display: none;
    }
    .scene-canvas {
      display: none;
    }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: opacity .2s;
      pointer-events: none;
    }
    .experience.is-loading .loading {
      opacity: .8;
    }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade {
      opacity: 1;
    }
    .experience.is-committing .background {
      transition: none !important;
    }

    /* PRELOADER */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
    }
    .preloader.is-background {
      z-index: 0;
    }
    .preloader.is-background .preloader-shade {
      opacity: 0;
    }
    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 58px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(.16, 1, .3, 1),
                  top 2s cubic-bezier(.16, 1, .3, 1),
                  width 2s cubic-bezier(.16, 1, .3, 1),
                  height 2s cubic-bezier(.16, 1, .3, 1),
                  transform 2s cubic-bezier(.16, 1, .3, 1);
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 37px;
      height: 36px;
      transform: none;
    }
    .floating-logo.is-settled {
      z-index: 5;
    }
    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
    }
    .preloader-count.is-leaving {
      animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes preload-count-out {
      to {
        opacity: 0;
        filter: blur(7px);
        transform: translate(-50%, -34px);
      }
    }
    body:not(.preload-complete) .custom-cursor {
      opacity: 0 !important;
    }

    /* CUSTOM CURSOR */
    .custom-cursor {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: 1px;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .custom-cursor.is-visible {
      opacity: 1;
    }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 12px;
      height: 12px;
      background: #fff;
    }
    .cursor-orbit {
      width: 36px;
      height: 36px;
      border: 1px solid #fff;
      background: rgba(255, 255, 255, .4);
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.16);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 16px/1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ENTRANCE / SWITCH ANIMATIONS */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    .planet-content h1,
    .planet-content .fact {
      opacity: 0;
    }
    .intro-ready .header {
      animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
    }
    .intro-ready .planet-list {
      animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
    }
    .content-revealing h1 {
      animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
    }
    .content-revealing .fact {
      animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both;
    }
    .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1s; }

    .mask-revealing .portal-heading {
      animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
    }
    .planet-list.is-switching .planet-item {
      animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
    }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }

    .planet-list.is-switching .planet-item.active:before {
      animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
    }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
      to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: .35; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
      .planet-content dl { width: 43vw; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 16px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 14px; }
      .portal-heading strong { font-size: 16px; }
      .menu { height: 38px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>
<body>
<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
    <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
    <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>

  <aside class="planet-list chrome" aria-label="Planets"></aside>   <!-- JS-filled -->

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">

      <img id="portal-image" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg" alt="Mercury" crossorigin="anonymous">

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>

  <div class="transition-layer" aria-hidden="true"><video id="transition-video" muted playsinline preload="auto" crossorigin="anonymous"></video></div>

</main>

<script>
(() => {
  // Remote assets
  const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
  const MARS_BG   = `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
  const TO_EARTH  = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
  const TO_VENUS  = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
  const TO_MARS   = `${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`;
  const MERCURY   = `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;
  const LOGO      = `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`;

  // Data model
  const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

  const states = {
    mars: {
      name: 'Mars',
      next: 'Earth',
      number: '[03]',
      portal: TO_EARTH,
      background: 'mars-background',
      facts: [
        ['Distance:', 'About 228 million km (1.5 astronomical units).'],
        ['Year:', 'One Martian year is equal to 687 Earth days.'],
        ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
        ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
      ]
    },
    earth: {
      name: 'Earth',
      next: 'Venus',
      number: '[02]',
      portal: TO_VENUS,
      background: 'earth-background',
      facts: [
        ['Distance:', '149.6 million km from the Sun.'],
        ['Year:', '365.25 Earth days.'],
        ['Temperature:', 'Average surface temperature around 15 °C.'],
        ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
      ]
    },
    venus: {
      name: 'Venus',
      next: 'Mercury',
      number: '[06]',
      image: MERCURY,
      background: 'venus-background',
      facts: [
        ['Distance:', '108.2 million km from the Sun.'],
        ['Year:', '225 Earth days.'],
        ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
        ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
      ]
    }
  };

  // State variables
  let current = 'mars';
  let busy = false;
  let transitionActive = false;
  let expansion = 0;
  let maskScale = 0;
  let canvasOpacity = 1;
  let frozenSceneExists = false;
  let isFirstRender = true;

  // DOM Elements
  const experienceEl = document.querySelector('.experience');
  const preloaderEl = document.getElementById('preloader');
  const preloaderVideoEl = document.getElementById('preloader-video');
  const preloaderCountEl = document.getElementById('preloader-count');
  const preloaderValEl = document.getElementById('preloader-value');
  const floatingLogoEl = document.getElementById('floating-logo');
  const portalCanvas = document.getElementById('portal-canvas');
  const portalCtx = portalCanvas.getContext('2d');
  const sceneCanvas = document.getElementById('scene-canvas');
  const sceneCtx = sceneCanvas.getContext('2d');
  const portalBtn = document.getElementById('portal');
  const portalVideoEl = document.getElementById('portal-video');
  const portalImageEl = document.getElementById('portal-image');
  const nextNumberEl = document.getElementById('next-number');
  const nextNameEl = document.getElementById('next-name');
  const planetTitleEl = document.getElementById('planet-title');
  const factsEl = document.getElementById('facts');
  const planetListEl = document.querySelector('.planet-list');
  const transitionVideoEl = document.getElementById('transition-video');

  // Custom cursor elements
  const cursorEl = document.querySelector('.custom-cursor');
  const cursorDotEl = cursorEl.querySelector('.cursor-dot');
  const cursorOrbitEl = cursorEl.querySelector('.cursor-orbit');
  let pointerX = window.innerWidth / 2;
  let pointerY = window.innerHeight / 2;
  let orbitX = pointerX;
  let orbitY = pointerY;
  let cursorVisible = false;

  // Tilt variables
  let targetX = 0;
  let targetY = 0;
  let rotX = 0;
  let rotY = 0;
  let lastTime = performance.now();

  // Easing function
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function animateValue(setter, duration) {
    return new Promise(resolve => {
      const start = performance.now();
      function tick(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / duration);
        setter(easeInOutCubic(t));
        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          setter(1);
          resolve();
        }
      }
      requestAnimationFrame(tick);
    });
  }

  // Canvas resizing
  function resizeCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    portalCanvas.width = window.innerWidth * d;
    portalCanvas.height = window.innerHeight * d;
    portalCanvas.style.width = window.innerWidth + 'px';
    portalCanvas.style.height = window.innerHeight + 'px';
    portalCtx.setTransform(d, 0, 0, d, 0, 0);

    if (!frozenSceneExists) {
      sceneCanvas.width = window.innerWidth * d;
      sceneCanvas.height = window.innerHeight * d;
      sceneCanvas.style.width = window.innerWidth + 'px';
      sceneCanvas.style.height = window.innerHeight + 'px';
      sceneCtx.setTransform(d, 0, 0, d, 0, 0);
    }
  }

  // Draw cover mode for screen-locked stationary rendering
  function drawCover(ctx, media) {
    if (!media) return;
    const mw = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
    const mh = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
    if (!mw || !mh) return;
    const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
    const w = mw * scale;
    const h = mh * scale;
    ctx.drawImage(media, (window.innerWidth - w) / 2, (window.innerHeight - h) / 2, w, h);
  }

  // Shade overlay
  function drawShade(ctx) {
    const y0 = window.innerHeight * 0.52;
    const y1 = window.innerHeight;
    const grad = ctx.createLinearGradient(0, y0, 0, y1);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.88)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y0, window.innerWidth, window.innerHeight - y0);
  }

  // Rounded rectangle sampling
  function getRoundedRectPoints(w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    const corners = [
      [  w / 2 - r, -h / 2 + r, -Math.PI / 2, 0 ],
      [  w / 2 - r,  h / 2 - r, 0, Math.PI / 2 ],
      [ -w / 2 + r,  h / 2 - r,  Math.PI / 2, Math.PI ],
      [ -w / 2 + r, -h / 2 + r,  Math.PI, Math.PI * 1.5 ]
    ];
    const points = [];
    for (let c = 0; c < 4; c++) {
      const [ccx, ccy, aStart, aEnd] = corners[c];
      const steps = 10;
      for (let s = 0; s <= steps; s++) {
        const ang = aStart + (aEnd - aStart) * (s / steps);
        points.push([ccx + r * Math.cos(ang), ccy + r * Math.sin(ang)]);
      }
    }
    return points;
  }

  // Render state to DOM
  function render() {
    const state = states[current];
    experienceEl.dataset.planet = current;
    planetTitleEl.textContent = state.name.toUpperCase();
    nextNameEl.textContent = state.next;
    nextNumberEl.textContent = state.number;
    portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

    factsEl.innerHTML = state.facts
      .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
      .join('');

    planetListEl.innerHTML = planets
      .map(p => {
        const isActive = p.toLowerCase() === state.name.toLowerCase();
        return `<span class="planet-item${isActive ? ' active' : ''}">${p}</span>`;
      })
      .join('');

    if (!isFirstRender) {
      planetListEl.classList.remove('is-switching');
      void planetListEl.offsetWidth;
      planetListEl.classList.add('is-switching');
    }
    isFirstRender = false;

    // Toggle matching background video
    document.querySelectorAll('.backgrounds .background').forEach(vid => {
      if (vid.id === state.background) {
        vid.classList.add('is-visible');
        vid.loop = true;
        vid.play().catch(() => {});
      } else {
        vid.classList.remove('is-visible');
        vid.pause();
      }
    });

    // Portal media toggling
    if (state.image) {
      portalImageEl.style.display = 'block';
      portalVideoEl.style.display = 'none';
    } else {
      portalImageEl.style.display = 'none';
      portalVideoEl.style.display = 'block';
      if (portalVideoEl.src !== state.portal) {
        portalVideoEl.src = state.portal;
        portalVideoEl.load();
      }
      portalVideoEl.loop = true;
      portalVideoEl.play().catch(() => {});
    }
  }

  // Pointer tilt listeners
  window.addEventListener('pointermove', (e) => {
    pointerX = e.clientX;
    pointerY = e.clientY;
    if (!cursorVisible) {
      cursorVisible = true;
      cursorEl.classList.add('is-visible');
    }
    if (!busy && e.pointerType !== 'touch') {
      targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
      targetX = (e.clientY / window.innerHeight - 0.5) * -33;
    }
  });

  document.addEventListener('pointerleave', () => {
    cursorVisible = false;
    cursorEl.classList.remove('is-visible');
    targetX = 0;
    targetY = 0;
  });

  portalBtn.addEventListener('pointerenter', () => {
    cursorEl.classList.add('is-enter');
  });

  portalBtn.addEventListener('pointerleave', () => {
    cursorEl.classList.remove('is-enter');
  });

  // Cursor update loop
  function cursorLoop() {
    orbitX += (pointerX - orbitX) * 0.2;
    orbitY += (pointerY - orbitY) * 0.2;
    cursorEl.style.transform = `translate3d(${pointerX}px, ${pointerY}px, 0)`;
    const dx = orbitX - pointerX;
    const dy = orbitY - pointerY;
    const isEnter = cursorEl.classList.contains('is-enter');
    const scale = isEnter ? ' scale(1.16)' : '';
    cursorOrbitEl.style.transform = `translate3d(${dx}px, ${dy}px, 0) translate(-50%, -50%)${scale}`;
    requestAnimationFrame(cursorLoop);
  }

  // Canvas main draw loop
  function draw(now) {
    const dt = Math.min(40, now - lastTime);
    lastTime = now;

    rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
    rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

    portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (frozenSceneExists) {
      portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
      drawShade(portalCtx);
    }

    const rect = portalBtn.getBoundingClientRect();
    const rectCx = rect.left + rect.width / 2;
    const rectCy = rect.top + rect.height / 2;
    const e = expansion;

    const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
    const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
    const baseW = rect.width + (window.innerWidth - rect.width) * e;
    const baseH = rect.height + (window.innerHeight - rect.height) * e;
    const scale = e ? 1 : maskScale;
    const w = baseW * scale;
    const h = baseH * scale;
    const r = 90 * (1 - e) * scale;
    const rx = rotX * (1 - e);
    const ry = rotY * (1 - e);

    if (w > 1 && h > 1) {
      const points = getRoundedRectPoints(w, h, r);
      const ax = rx * Math.PI / 180;
      const ay = ry * Math.PI / 180;
      const cosAx = Math.cos(ax);
      const sinAx = Math.sin(ax);
      const cosAy = Math.cos(ay);
      const sinAy = Math.sin(ay);

      portalCtx.save();
      portalCtx.globalAlpha = canvasOpacity;

      portalCtx.beginPath();
      for (let i = 0; i < points.length; i++) {
        const [px, py] = points[i];
        const xx = px * cosAy;
        const yy = py * cosAx;
        const z = px * sinAy - py * sinAx;
        const p = 850 / (850 + z);
        const sx = cx + xx * p;
        const sy = cy + yy * p;
        if (i === 0) portalCtx.moveTo(sx, sy);
        else portalCtx.lineTo(sx, sy);
      }
      portalCtx.closePath();

      portalCtx.clip();
      portalCtx.fillStyle = '#030303';
      portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const activeMedia = transitionActive
        ? transitionVideoEl
        : (states[current].image ? portalImageEl : portalVideoEl);

      drawCover(portalCtx, activeMedia);

      if (transitionActive) {
        drawShade(portalCtx);
      }

      portalCtx.restore();
    }

    requestAnimationFrame(draw);
  }

  // Reveal helpers
  function revealMask() {
    experienceEl.classList.remove('mask-revealing');
    void experienceEl.offsetWidth;
    experienceEl.classList.add('mask-revealing');
    maskScale = 0;
    return animateValue(v => { maskScale = v; }, 1050);
  }

  function revealPlanetContent() {
    experienceEl.classList.remove('content-revealing');
    void experienceEl.offsetWidth;
    experienceEl.classList.add('content-revealing');
  }

  function waitForMedia(media) {
    return new Promise(resolve => {
      if (!media) return resolve();
      if (media.tagName === 'IMG') {
        if (media.complete && media.naturalWidth > 0) return resolve();
        media.addEventListener('load', () => resolve(), { once: true });
        media.addEventListener('error', () => resolve(), { once: true });
        setTimeout(resolve, 2000);
      } else {
        if (media.readyState >= 2) return resolve();
        media.addEventListener('canplay', () => resolve(), { once: true });
        media.addEventListener('error', () => resolve(), { once: true });
        setTimeout(resolve, 2000);
      }
    });
  }

  // Travel sequence
  async function travel() {
    if (busy || current === 'venus') return;
    busy = true;
    targetX = 0;
    targetY = 0;

    const next = current === 'mars' ? 'earth' : 'venus';

    try {
      transitionVideoEl.src = states[current].portal;
      transitionVideoEl.load();
      experienceEl.classList.add('is-loading');

      await new Promise(resolve => {
        let done = false;
        const finishWait = () => {
          if (!done) {
            done = true;
            resolve();
          }
        };
        transitionVideoEl.addEventListener('canplaythrough', finishWait, { once: true });
        transitionVideoEl.addEventListener('error', finishWait, { once: true });
        setTimeout(finishWait, 1600);
      });

      experienceEl.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
      experienceEl.classList.add('is-transitioning');

      transitionVideoEl.currentTime = 0;
      transitionVideoEl.playbackRate = 1.3;
      canvasOpacity = 1;
      transitionActive = true;

      try {
        await transitionVideoEl.play();
      } catch (e) {
        console.warn('Transition video playback notice:', e);
      }

      await animateValue(v => { expansion = v; }, 1100);

      await new Promise(resolve => {
        if (transitionVideoEl.ended) return resolve();
        transitionVideoEl.addEventListener('ended', resolve, { once: true });
        const dur = transitionVideoEl.duration || 3;
        const leftMs = Math.max(500, ((dur - transitionVideoEl.currentTime) / 1.3) * 1000 + 500);
        setTimeout(resolve, leftMs);
      });

      // Freeze final frame into sceneCanvas
      const d = Math.min(window.devicePixelRatio || 1, 2);
      sceneCanvas.width = window.innerWidth * d;
      sceneCanvas.height = window.innerHeight * d;
      sceneCanvas.style.width = window.innerWidth + 'px';
      sceneCanvas.style.height = window.innerHeight + 'px';
      sceneCtx.setTransform(d, 0, 0, d, 0, 0);
      sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawCover(sceneCtx, transitionVideoEl);
      frozenSceneExists = true;

      current = next;
      experienceEl.classList.add('is-committing');
      render();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      transitionActive = false;
      expansion = 0;
      maskScale = 0;
      canvasOpacity = 1;

      experienceEl.classList.remove('is-transitioning', 'is-committing');

      const maskReveal = revealMask();
      setTimeout(() => {
        revealPlanetContent();
      }, 100);
      await maskReveal;

      setTimeout(() => {
        transitionVideoEl.removeAttribute('src');
        transitionVideoEl.load();
        busy = false;
      }, 450);

    } catch (err) {
      console.error('Travel exception:', err);
      transitionActive = false;
      expansion = 0;
      maskScale = 1;
      canvasOpacity = 1;
      experienceEl.classList.remove('is-loading', 'is-transitioning', 'is-committing');
      busy = false;
    }
  }

  portalBtn.addEventListener('click', (e) => {
    e.preventDefault();
    travel();
  });

  // Start Experience
  async function startExperience() {
    const currentMedia = states[current].image ? portalImageEl : portalVideoEl;
    await waitForMedia(currentMedia);

    const bgVid = document.getElementById(states[current].background);
    if (bgVid) {
      bgVid.loop = true;
      bgVid.play().catch(() => {});
    }
    if (!states[current].image && portalVideoEl) {
      portalVideoEl.loop = true;
      portalVideoEl.play().catch(() => {});
    }

    await revealMask();
    document.body.classList.add('intro-ready');
    setTimeout(() => {
      revealPlanetContent();
    }, 850);
  }

  // Preloader sequence
  function runPreloader() {
    let finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      preloaderValEl.textContent = '100';
      preloaderCountEl.classList.add('is-leaving');
      floatingLogoEl.classList.add('is-docked');
      preloaderEl.classList.add('is-background');
      document.body.classList.add('preload-complete');
      startExperience();
      setTimeout(() => {
        preloaderCountEl.remove();
      }, 750);
      setTimeout(() => {
        floatingLogoEl.classList.add('is-settled');
      }, 2000);
    }

    function onReady() {
      const dur = preloaderVideoEl.duration || 3;
      preloaderVideoEl.playbackRate = Math.max(0.25, dur / 3);
      const p = preloaderVideoEl.play();
      if (p !== undefined) {
        p.catch(() => finish());
      }

      function updateProgress() {
        if (finished) return;
        const cur = preloaderVideoEl.currentTime;
        const d = preloaderVideoEl.duration || 3;
        const percent = Math.min(100, Math.round((cur / d) * 100));
        preloaderValEl.textContent = String(percent);
        if (!preloaderVideoEl.ended && percent < 100) {
          requestAnimationFrame(updateProgress);
        }
      }
      requestAnimationFrame(updateProgress);

      preloaderVideoEl.addEventListener('ended', finish, { once: true });
      setTimeout(() => {
        if (!finished) finish();
      }, 6000);
    }

    if (preloaderVideoEl.readyState >= 1) {
      onReady();
    } else {
      preloaderVideoEl.addEventListener('loadedmetadata', onReady, { once: true });
      preloaderVideoEl.addEventListener('error', finish, { once: true });
      setTimeout(() => {
        if (!finished && preloaderVideoEl.readyState < 1) {
          finish();
        }
      }, 3500);
    }
  }

  // Boot order
  document.querySelectorAll('.backgrounds .background').forEach(vid => {
    vid.pause();
    vid.currentTime = 0;
  });

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();

})();
</script>
</body>
</html>
